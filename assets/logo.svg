<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#233554" stroke-width="3" opacity="0.6"/>

  <!-- NAS Bay Outlines (Stylized Synology 4-bay) -->
  <g opacity="0.35" transform="translate(106, 116)">
    <rect x="0" y="0" width="60" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="80" y="0" width="60" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="160" y="0" width="60" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="240" y="0" width="60" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- LED Indicators -->
    <circle cx="30" cy="30" r="5" fill="#00F2FE"/>
    <circle cx="110" cy="30" r="5" fill="#00F2FE"/>
    <circle cx="190" cy="30" r="5" fill="#00F2FE"/>
    <circle cx="270" cy="30" r="5" fill="#00F2FE"/>
  </g>

  <!-- Glowing Heartbeat / Pulse Wave -->
  <!-- Back Glow Wave -->
  <path d="M 32 256 L 140 256 L 170 210 L 205 310 L 245 140 L 290 370 L 330 220 L 360 270 L 385 256 L 480 256"
        fill="none" stroke="url(#pulseGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)" opacity="0.65"/>

  <!-- Crisp Core Wave -->
  <path d="M 32 256 L 140 256 L 170 210 L 205 310 L 245 140 L 290 370 L 330 220 L 360 270 L 385 256 L 480 256"
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stethoscope / Medical Cross Accent -->
  <g transform="translate(256, 75)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#111c30" stroke="#00F2FE" stroke-width="3"/>
    <path d="M -12 0 L 12 0 M 0 -12 L 0 12" stroke="#00F2FE" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
